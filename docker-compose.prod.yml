services:
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - ./packages/server/.env.prod
    environment:
      - CHROMA_URL=http://chroma:8000
      - PORT=3001
      # embedding-3 相关块的 cosine 距离普遍在 ~0.5~0.65，默认 0.5 会把正确块
      # 卡在阈值外，导致每次检索都触发 doc_retrieval_minK 降级。放宽到 0.7。
      - RAG_DISTANCE_THRESHOLD=0.7
    depends_on:
      - chroma
    volumes:
      - server_data:/app/data
      - uploads:/app/uploads

  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bind to loopback only — public access goes through the host nginx +
      # Cloudflare, never directly to :8080. Set CLIENT_BIND=0.0.0.0 to expose.
      - "${CLIENT_BIND:-127.0.0.1}:${CLIENT_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  chroma_data:
  server_data:
  uploads:
