name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build:client

      - name: Check server starts
        run: |
          cd packages/server
          # 只验证语法，不实际启动（没有 API key）
          node --check src/index.js
        env:
          ANTHROPIC_API_KEY: placeholder
